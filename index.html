<html lang="ja">
<head>
<meta charset="UTF-8">

<title>沖縄釣り場マップ</title>
<style>
  :root{
    --bg:#050B14; --bg2:#0A1626; --panel:rgba(18,32,50,0.72); --panel-solid:#101F32;
    --cyan:#22D3EE; --cyan-bright:#7FF3FF; --cyan-dim:#0E7490;
    --sea:#22D3EE; --sea-deep:#0E9DB8; --sea-darker:#0B7285;
    --coral:#FF3D81; --coral-dark:#FF6FA0;
    --sand:#0F2036; --sand-dark:#1E3A55;
    --ink:#EAF6FB; --ink-soft:#8FAFC2;
    --good:#00E6A0; --warn:#FFB020; --warn-bg:rgba(255,176,32,0.14); --danger:#FF3D5A;
    --line:rgba(127,243,255,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(34,211,238,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 10%, rgba(255,61,129,0.10), transparent 55%),
      repeating-linear-gradient(0deg, rgba(127,243,255,0.035) 0px, rgba(127,243,255,0.035) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(127,243,255,0.035) 0px, rgba(127,243,255,0.035) 1px, transparent 1px, transparent 40px),
      var(--bg);
    color:var(--ink); font-size:16px; line-height:1.65; -webkit-text-size-adjust:100%;
  }
  #app{max-width:1120px; margin:0 auto; min-height:100vh; position:relative;}
  header{
    background:linear-gradient(120deg,#071827 0%, #0B2A3E 55%, #061520 100%);
    color:#fff; padding:36px 32px 30px; position:relative; overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  header::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:0.5;
    background-image: radial-gradient(circle at 85% 20%, rgba(34,211,238,0.25), transparent 45%);
  }
  header .inner{max-width:1120px; margin:0 auto; position:relative;}
  header h1{margin:0; font-size:clamp(24px,4vw,34px); font-weight:800; display:flex; align-items:center; gap:12px; letter-spacing:0.02em;
    background:linear-gradient(90deg,#fff, var(--cyan-bright)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  header p{margin:10px 0 0; font-size:15px; color:var(--ink-soft); max-width:560px;}
  header::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--cyan) 30%, var(--coral) 70%, transparent);
    box-shadow:0 0 12px 1px rgba(34,211,238,0.6);
  }
  nav#bottomnav{
    position:sticky; top:0; z-index:40; background:rgba(8,16,26,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line); display:flex; justify-content:center; gap:2px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  nav#bottomnav .inner{display:flex; max-width:1120px; width:100%; margin:0 auto; padding:0 12px;}
  nav#bottomnav button{
    flex:0 0 auto; background:none; border:none; border-bottom:3px solid transparent; padding:16px 20px; font-size:15px;
    font-weight:700; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap;
    transition:color 0.15s;
  }
  nav#bottomnav button .ic{font-size:18px; filter:grayscale(0.3);}
  nav#bottomnav button.active{color:var(--cyan-bright); border-bottom-color:var(--cyan); text-shadow:0 0 12px rgba(34,211,238,0.5);}
  nav#bottomnav button:hover{color:#fff;}
  .area-tabs{
    display:flex; gap:8px; flex-wrap:wrap; padding:20px 32px 4px; max-width:1120px; margin:0 auto;
  }
  .area-chip{
    flex:0 0 auto; padding:9px 18px; border-radius:8px; background:var(--panel); border:1px solid var(--sand-dark);
    color:var(--ink-soft); font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap; backdrop-filter:blur(6px);
    transition:all 0.15s;
  }
  .area-chip.active{background:linear-gradient(120deg,var(--cyan-dim),var(--cyan)); border-color:var(--cyan); color:#04222a; box-shadow:0 0 16px rgba(34,211,238,0.45);}
  .area-chip:hover:not(.active){border-color:var(--cyan); color:var(--cyan-bright);}
  main{padding:20px 32px 56px; max-width:1120px; margin:0 auto;}
  .tab-content{display:none;}
  .tab-content.active{display:block;}
  .card{
    background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:14px; padding:24px; margin-bottom:20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35); border:1px solid var(--line); position:relative;
  }
  .card::before{
    content:""; position:absolute; left:14px; right:14px; top:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(127,243,255,0.6), transparent);
  }
  .card h2{margin:0 0 14px; font-size:19px; color:var(--cyan-bright); display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:0.01em;}
  .card h3{margin:0 0 10px; font-size:19px; color:var(--ink); font-weight:800;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:10px;}
  .stat{background:var(--sand); border-radius:10px; padding:16px 10px; text-align:center; border:1px solid var(--sand-dark);}
  .stat .v{font-size:22px; font-weight:800; color:var(--cyan-bright); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; text-shadow:0 0 14px rgba(34,211,238,0.35);}
  .stat .l{font-size:12px; color:var(--ink-soft); margin-top:6px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;}
  .tide-chart{width:100%; height:auto; display:block; margin-top:14px;}
  .btn-refresh{border:1px solid var(--cyan); background:rgba(34,211,238,0.1); color:var(--cyan-bright); border-radius:8px; padding:9px 18px; font-size:13.5px; font-weight:700; cursor:pointer; transition:all 0.15s;}
  .btn-refresh:hover{background:var(--cyan); color:#04222a;}
  .badge{display:inline-block; padding:5px 12px; border-radius:6px; font-size:12.5px; font-weight:800; letter-spacing:0.02em;}
  .badge-niche{background:rgba(255,61,129,0.15); color:var(--coral-dark); border:1px solid rgba(255,61,129,0.4);}
  .badge-warn{background:var(--warn-bg); color:var(--warn); border:1px solid rgba(255,176,32,0.4);}
  .badge-good{background:rgba(0,230,160,0.15); color:var(--good); border:1px solid rgba(0,230,160,0.5); animation:pop 1.4s ease-in-out infinite;}
  .badge-moon{background:rgba(127,180,255,0.12); color:#9FC3FF; border:1px solid rgba(127,180,255,0.35);}
  @keyframes pop{0%,100%{box-shadow:0 0 0 rgba(0,230,160,0);}50%{box-shadow:0 0 12px rgba(0,230,160,0.6);}}
  .points-grid{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:760px){ .points-grid{grid-template-columns:1fr 1fr;} }
  .point-card{background:var(--sand); border-radius:12px; padding:18px 20px; border:1px solid var(--sand-dark); border-left:3px solid var(--cyan-dim);}
  .point-card .rank{font-size:20px; margin-right:6px;}
  .point-card .name{font-weight:800; font-size:17px; color:var(--ink);}
  .point-card .muni{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .point-card .timing{margin-top:10px; font-size:15px; color:var(--coral-dark); font-weight:800; line-height:1.5;}
  .point-card .advice{margin-top:8px; font-size:14px; color:var(--ink-soft); line-height:1.6;}
  .point-card .tags{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;}
  .toggle-all{width:100%; text-align:center; background:var(--panel); border:1px dashed var(--cyan-dim); color:var(--cyan-bright); border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; margin-top:4px;}
  .toggle-all:hover{background:rgba(34,211,238,0.08);}
  .fish-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media(min-width:640px){ .fish-grid{grid-template-columns:repeat(6,1fr);} }
  .fish-btn{background:var(--sand); border:1px solid var(--sand-dark); border-radius:12px; padding:16px 8px; text-align:center; cursor:pointer; transition:all 0.15s;}
  .fish-btn:hover{border-color:var(--cyan);}
  .fish-btn.active{border-color:var(--coral); background:rgba(255,61,129,0.08); box-shadow:0 0 16px rgba(255,61,129,0.25);}
  .fish-avatar{width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--cyan-dim),var(--cyan)); color:#04222a; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; margin:0 auto 10px; box-shadow:0 0 14px rgba(34,211,238,0.35);}
  .fish-btn .fname{font-size:13px; font-weight:700; line-height:1.4; color:var(--ink);}
  .rig-svg{width:100%; max-width:260px; display:block; margin:14px auto;}
  .term-chip{display:inline-flex; align-items:center; gap:5px; background:var(--sand); border:1px solid var(--sand-dark); border-radius:8px; padding:6px 14px; font-size:14px; font-weight:600; margin:4px 6px 4px 0; cursor:pointer; color:var(--ink);}
  .term-chip:hover{border-color:var(--cyan);}
  .term-chip .q{background:var(--cyan); color:#04222a; border-radius:50%; width:17px; height:17px; font-size:11px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; font-weight:800;}
  #glossaryPopover{position:fixed; left:20px; right:20px; bottom:24px; max-width:520px; margin:0 auto; background:var(--panel-solid); color:#fff; padding:16px 18px; border-radius:12px; font-size:14.5px; line-height:1.6; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:1px solid var(--line); display:none; z-index:50;}
  #glossaryPopover b{color:var(--cyan-bright); font-size:15.5px;}
  #glossaryPopover .close{float:right; cursor:pointer; opacity:0.75; font-size:15px; padding:0 2px;}
  form.logform{display:flex; flex-direction:column; gap:12px; max-width:480px;}
  form.logform label{font-size:13.5px; color:var(--ink-soft); font-weight:700;}
  form.logform input, form.logform select, form.logform textarea{
    padding:12px 14px; border-radius:8px; border:1px solid var(--sand-dark); font-size:15.5px; font-family:inherit; width:100%; color:var(--ink); background:var(--sand);
  }
  form.logform input:focus, form.logform select:focus, form.logform textarea:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,0.2);}
  .btn-primary{background:linear-gradient(120deg,var(--cyan-dim),var(--cyan)); color:#04222a; border:none; border-radius:10px; padding:13px; font-size:15.5px; font-weight:800; cursor:pointer; box-shadow:0 4px 16px rgba(34,211,238,0.3);}
  .btn-primary:hover{filter:brightness(1.1);}
  .catch-item{background:var(--sand); border-radius:12px; padding:16px 18px; margin-bottom:12px; position:relative; border:1px solid var(--sand-dark); border-left:3px solid var(--coral);}
  .catch-item .date{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .catch-item .fish{font-weight:800; font-size:16px; margin-top:4px; color:var(--ink);}
  .catch-item .place{font-size:14px; color:var(--ink-soft);}
  .catch-item .memo{font-size:14px; margin-top:6px; color:var(--ink);}
  .catch-item .del{position:absolute; right:14px; top:14px; background:transparent; border:1px solid var(--sand-dark); border-radius:8px; color:var(--coral-dark); font-size:12.5px; font-weight:700; padding:4px 10px; cursor:pointer;}
  .catch-item .del:hover{background:var(--coral); color:#fff; border-color:var(--coral);}
  .muted{color:var(--ink-soft); font-size:14px;}
  .disclaimer{font-size:12.5px; color:var(--ink-soft); margin-top:12px; line-height:1.6; border-top:1px dashed var(--sand-dark); padding-top:10px;}
  footer{max-width:1120px; margin:0 auto; padding:8px 32px 40px; color:var(--ink-soft); font-size:13px; text-align:center;}
</style>
</head>

/* ==================== TIDE (simplified harmonic model, approximate) ==================== */
const TIDE_EPOCH = Date.UTC(2000, 0, 1, 0, 0, 0);

const CONSTITUENTS = [

  { name: 'S2', speed: 30.0000000, amp: 12.6, phase: 178 },
  { name: 'K1', speed: 15.0410686, amp: 24.8, phase: 253 },
  { name: 'O1', speed: 13.9430356, amp: 18.6, phase: 231 },
  { name: 'N2', speed: 28.4397295, amp: 5.3, phase: 141 },
  { name: 'K2', speed: 30.0821373, amp: 3.7, phase: 176 },
  { name: 'P1', speed: 14.9589314, amp: 8.1, phase: 251 },
  { name: 'Q1', speed: 13.3986609, amp: 3.9, phase: 227 },

function tideHeightCm(date) {

  }

}

  for (let i = 1; i < samples.length - 1; i++) {
    const a = samples[i - 1].h, b = samples[i].h, c = samples[i + 1].h;
    if (b > a && b > c) ext.push({ t: samples[i].t, h: b, type: 'high' });

}

  const diff = h1 - h0;
  const near = extrema.find(e => Math.abs(e.t.getTime() - now.getTime()) <= 45 * 60000);

  return diff > 0 ? 'rising' : 'falling';
}

  return { high: '満潮前後', low: '干潮前後', rising: '上げ潮', falling: '下げ潮' }[key] || key;
}

  const list = extrema.filter(e => e.type === type);

  return list[0];
}

      labelTag(102, 205, '孫針+活きアジ', '#FF6FA0') +

    );

};

/* ==================== STATE ==================== */
const state = { area: 'naha', cache: {}, activeTab: 'home', showAllPoints: false, activeFish: null };

/* ==================== API ==================== */
async function fetchAreaData(area) {
  const wUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + area.lat + '&longitude=' + area.lon +
    '&current=wind_speed_10m,wind_direction_10m,temperature_2m&daily=sunrise,sunset&timezone=Asia%2FTokyo&forecast_days=1&wind_speed_unit=ms';
  const mUrl = 'https://marine-api.open-meteo.com/v1/marine?latitude=' + area.lat + '&longitude=' + area.lon +
    '&hourly=wave_height,wave_period&timezone=Asia%2FTokyo&forecast_days=1';
  const result = { wind: null, wave: null, wavePeriod: null, sunrise: null, sunset: null, temp: null, weatherError: false, waveError: false };
  try {
    const wRes = await fetch(wUrl);
    const wJson = await wRes.json();
    result.wind = { speed: wJson.current.wind_speed_10m, direction: wJson.current.wind_direction_10m };
    result.temp = wJson.current.temperature_2m;
    if (wJson.daily) {
      result.sunrise = wJson.daily.sunrise && wJson.daily.sunrise[0] ? new Date(wJson.daily.sunrise[0]) : null;
      result.sunset = wJson.daily.sunset && wJson.daily.sunset[0] ? new Date(wJson.daily.sunset[0]) : null;
    }
  } catch (e) { result.weatherError = true; }
  try {
    const mRes = await fetch(mUrl);
    const mJson = await mRes.json();
    if (mJson.hourly && mJson.hourly.wave_height) {
      const now = new Date();
      const times = mJson.hourly.time.map(function (t) { return new Date(t); });
      let idx = times.findIndex(function (t) { return t >= now; });
      if (idx < 0) idx = times.length - 1;
      result.wave = mJson.hourly.wave_height[idx];
      result.wavePeriod = mJson.hourly.wave_period ? mJson.hourly.wave_period[idx] : null;
    }
  } catch (e) { result.waveError = true; }
  return result;
}
async function refreshArea(areaId) {
  const area = AREAS.find(function (a) { return a.id === areaId; });
  state.cache[areaId] = { loading: true };
  renderHome(); renderPoints();
  const data = await fetchAreaData(area);
  state.cache[areaId] = { loading: false, data: data, ts: new Date() };
  renderHome(); renderPoints();
}

/* ==================== CATCH LOG (localStorage) ==================== */
function loadCatches() {
  const raw = localStorage.getItem('okFishingCatches');
  if (!raw) { localStorage.setItem('okFishingCatches', JSON.stringify(SAMPLE_CATCHES)); return SAMPLE_CATCHES.slice(); }
  try { return JSON.parse(raw); } catch (e) { return SAMPLE_CATCHES.slice(); }
}
function saveCatches(list) { localStorage.setItem('okFishingCatches', JSON.stringify(list)); }
function addCatch(record) {
  record.id = 'c-' + Date.now();
  const list = loadCatches();
  list.unshift(record);
  saveCatches(list);
  return list;
}
function deleteCatch(id) {
  const list = loadCatches().filter(function (c) { return c.id !== id; });
  saveCatches(list);
  return list;
}

/* ==================== RENDER: HOME ==================== */
function buildTideChartSVG(timeline, extrema, now) {
  const w = 600, h = 150, pad = 10;
  const hs = timeline.map(function (s) { return s.h; });
  const minH = Math.min.apply(null, hs), maxH = Math.max.apply(null, hs);
  const scaleX = function (i) { return pad + (i / (timeline.length - 1)) * (w - 2 * pad); };
  const scaleY = function (v) { return h - pad - ((v - minH) / (maxH - minH || 1)) * (h - 2 * pad); };
  let d = '';
  timeline.forEach(function (s, i) { d += (i === 0 ? 'M' : 'L') + scaleX(i).toFixed(1) + ',' + scaleY(s.h).toFixed(1) + ' '; });
  let nowIdx = timeline.findIndex(function (s) { return s.t >= now; });
  if (nowIdx < 0) nowIdx = timeline.length - 1;
  const nx = scaleX(nowIdx), ny = scaleY(tideHeightCm(now));
  let extMarks = '';
  extrema.forEach(function (e) {
    const idx = Math.round((e.t - timeline[0].t) / (5 * 60000));
    if (idx < 0 || idx >= timeline.length) return;
    const ex = scaleX(idx), ey = scaleY(e.h);
    extMarks += '<circle cx="' + ex + '" cy="' + ey + '" r="4" fill="' + (e.type === 'high' ? '#FF3D81' : '#22D3EE') + '"/>';
    extMarks += '<text x="' + ex + '" y="' + (e.type === 'high' ? ey - 8 : ey + 16) + '" font-size="10" text-anchor="middle" fill="#CFEFF6">' + (e.type === 'high' ? '満' : '干') + ' ' + fmt(e.t) + '</text>';
  });
  let grid = '';
  for (let gy = 0; gy <= h; gy += 30) grid += '<line x1="0" y1="' + gy + '" x2="' + w + '" y2="' + gy + '" stroke="rgba(127,243,255,0.08)" stroke-width="1"/>';
  for (let gx = 0; gx <= w; gx += 50) grid += '<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="' + h + '" stroke="rgba(127,243,255,0.08)" stroke-width="1"/>';
  const areaD = d.trim() + ' L' + w + ',' + h + ' L0,' + h + ' Z';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="tide-chart">' +
    '<defs>' +
      '<filter id="tideGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
      '<linearGradient id="tideFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>' +
    '</defs>' +
    grid +
    '<path d="' + areaD + '" fill="url(#tideFill)" stroke="none"/>' +
    '<path d="' + d + '" fill="none" stroke="#22D3EE" stroke-width="2.5" filter="url(#tideGlow)"/>' + extMarks +
    '<line x1="' + nx + '" y1="0" x2="' + nx + '" y2="' + h + '" stroke="#FF3D81" stroke-dasharray="4,3" stroke-width="1.5"/>' +
    '<circle cx="' + nx + '" cy="' + ny + '" r="5" fill="#FF3D81" stroke="#DCEFF5" stroke-width="1.5" filter="url(#tideGlow)"/></svg>';
}
function getCtx() {
  const now = new Date();
  const timeline = buildTideTimeline(now);
  const extrema = findExtrema(timeline);
  const tideState = tideStateNow(now, extrema);
  const moonLabel = moonPhaseLabel(moonAgeDays(now));
  const cache = state.cache[state.area];
  const data = cache && cache.data ? cache.data : null;
  return { now: now, timeline: timeline, extrema: extrema, tideState: tideState, moonLabel: moonLabel,
    sunrise: data ? data.sunrise : null, sunset: data ? data.sunset : null,
    wind: data ? data.wind : null, wave: data ? data.wave : null, wavePeriod: data ? data.wavePeriod : null,
    weatherError: data ? data.weatherError : false, waveError: data ? data.waveError : false, loading: cache ? cache.loading : true };
}
function renderHome() {
  const el = document.getElementById('tab-home');
  const area = AREAS.find(function (a) { return a.id === state.area; });
  const ctx = getCtx();
  const chart = buildTideChartSVG(ctx.timeline, ctx.extrema, ctx.now);
  const stateLabel = tideStateLabelJP(ctx.tideState);
  let windHtml = '<span class="muted">取得中...</span>';
  if (!ctx.loading) {
    if (ctx.wind) windHtml = degToCompassJP(ctx.wind.direction) + ' ' + ctx.wind.speed.toFixed(1) + 'm/s';
    else windHtml = '<span class="muted">取得できません</span>';
  }
  let waveHtml = '<span class="muted">取得中...</span>';
  if (!ctx.loading) {
    waveHtml = (ctx.wave != null) ? ctx.wave.toFixed(1) + 'm' : '<span class="muted">データなし</span>';
  }
  const tsLabel = state.cache[state.area] && state.cache[state.area].ts ? fmt(state.cache[state.area].ts) + '時点' : '';
  el.innerHTML =
    '<div class="card">' +
      '<div class="row"><h2>🌤️ ' + area.name + ' の今</h2><button class="btn-refresh" id="refreshBtn">🔄更新</button></div>' +
      '<div class="stat-grid">' +
        '<div class="stat"><div class="v">' + stateLabel + '</div><div class="l">潮の状態</div></div>' +
        '<div class="stat"><div class="v">' + windHtml + '</div><div class="l">風向・風速</div></div>' +
        '<div class="stat"><div class="v">' + waveHtml + '</div><div class="l">波の高さ</div></div>' +
      '</div>' +
      '<div class="row" style="margin-top:8px;"><span class="badge badge-moon">🌙 本日は' + ctx.moonLabel + '</span>' +
      (tsLabel ? '<span class="muted">' + tsLabel + '</span>' : '') + '</div>' +
      chart +
      '<div class="disclaimer">※潮汐は気象庁公開の那覇標準港調和定数を基にした簡易計算の目安です。実測値ではありません。風・波はOpen-Meteoの無料データです。</div>' +
    '</div>';
  const btn = document.getElementById('refreshBtn');
  if (btn) btn.addEventListener('click', function () { refreshArea(state.area); });
}

/* ==================== RENDER: POINTS ==================== */
function renderPoints() {
  const el = document.getElementById('tab-points');
  const area = AREAS.find(function (a) { return a.id === state.area; });
  const ctx = getCtx();
  const pts = POINTS.filter(function (p) { return p.areaId === state.area; });
  const scored = pts.map(function (p) {
    const s = scorePoint(p, ctx);
    const timing = resolveTiming(p, ctx);
    return { point: p, score: s.score, reasons: s.reasons, warning: s.warning, timing: timing };
  });
  scored.sort(function (a, b) { return b.score - a.score; });
  const top = scored.slice(0, 5);
  const rest = scored.slice(5);
  const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];

  function cardHtml(item, idx) {
    const p = item.point;
    let badges = '';
    if (p.niche) badges += '<span class="badge badge-niche">穴場</span> ';
    if (item.warning) badges += '<span class="badge badge-warn">⚠️ ' + item.warning + '</span> ';
    else if (item.score >= 5) badges += '<span class="badge badge-good">🎉本命チャンス！</span> ';
    if (item.timing.badge) badges += '<span class="badge badge-moon">' + item.timing.badge + '</span> ';
    const reasonLine = item.reasons.length ? item.reasons.join('・') : (p.tideAffinity === 'any' ? '潮を問わず楽しめる' : '');
    return '<div class="point-card">' +
      '<div class="row"><div><span class="rank">' + (idx != null ? medals[idx] || '' : '') + '</span><span class="name">' + p.name + '</span></div><span class="muni">' + p.muni + '</span></div>' +
      (badges ? '<div class="tags">' + badges + '</div>' : '') +
      '<div class="timing">🎣 ' + item.timing.text + '</div>' +
      '<div class="advice">' + genericAdvice(p) + (reasonLine ? '（' + reasonLine + '）' : '') + '</div>' +
      '</div>';
  }

  let html = '<div class="card"><h2>🎯 ' + area.name + ' のおすすめポイント</h2>' +
    '<div class="muted" style="margin-bottom:14px;">潮・風・波のスコアから自動算出した本日のおすすめ順です。</div>' +
    '<div class="points-grid">';
  top.forEach(function (item, idx) { html += cardHtml(item, idx); });
  html += '</div>';
  if (!top.length) html += '<div class="muted">このエリアのポイント情報がありません。</div>';
  html += '</div>';
  if (rest.length) {
    html += '<div class="card" id="restWrap" style="' + (state.showAllPoints ? '' : 'display:none;') + '">' +
      '<h2>他のポイント一覧</h2><div class="points-grid">';
    rest.forEach(function (item) { html += cardHtml(item, null); });
    html += '</div></div>';
    html += '<button class="toggle-all" id="toggleAllBtn">' + (state.showAllPoints ? '一覧を閉じる ▲' : 'このエリアの全ポイントを見る ▼') + '</button>';
  }
  el.innerHTML = html;
  const t = document.getElementById('toggleAllBtn');
  if (t) t.addEventListener('click', function () { state.showAllPoints = !state.showAllPoints; renderPoints(); });
}

/* ==================== RENDER: FISH ==================== */
function renderFish() {
  const el = document.getElementById('tab-fish');
  let grid = '<div class="card"><h2>🐟 狙いの魚を選ぶ</h2><div class="fish-grid">';
  FISH_DB.forEach(function (f) {
    grid += '<div class="fish-btn' + (state.activeFish === f.key ? ' active' : '') + '" data-fish="' + f.key + '">' +
      '<div class="fish-avatar">' + f.name.charAt(0) + '</div><div class="fname">' + f.name + '</div></div>';
  });
  grid += '</div></div>';

  let detail = '';
  if (state.activeFish) {
    const f = FISH_DB.find(function (x) { return x.key === state.activeFish; });
    const rigSvg = RIG_BUILDERS[f.rigType] ? RIG_BUILDERS[f.rigType]() : '';
    let terms = '';
    (f.terms || []).forEach(function (t) {
      terms += '<span class="term-chip" data-term="' + t + '"><span class="q">?</span>' + t + '</span>';
    });
    detail = '<div class="card">' +
      '<h3>' + f.name + '</h3>' + rigSvg +
      '<div><b>仕掛け：</b>' + f.rig + '</div>' +
      '<div style="margin-top:4px;">' + terms + '</div>' +
      '<div style="margin-top:8px;"><b>餌：</b>' + f.bait + '</div>' +
      '<div style="margin-top:8px;"><b>狙い目：</b>' + f.timing + '</div>' +
      '</div>';
  }
  el.innerHTML = grid + detail;
  el.querySelectorAll('.fish-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { state.activeFish = btn.getAttribute('data-fish'); renderFish(); });
  });
  el.querySelectorAll('.term-chip').forEach(function (chip) {
    chip.addEventListener('click', function () { showGlossary(chip.getAttribute('data-term')); });
  });
}
let glossaryTimer = null;
function showGlossary(term) {
  const pop = document.getElementById('glossaryPopover');
  pop.innerHTML = '<span class="close" id="glossaryClose">✕</span><b>' + term + '</b><br>' + (GLOSSARY[term] || '');
  pop.style.display = 'block';
  document.getElementById('glossaryClose').addEventListener('click', function () { pop.style.display = 'none'; });
  if (glossaryTimer) clearTimeout(glossaryTimer);
  glossaryTimer = setTimeout(function () { pop.style.display = 'none'; }, 7000);
}

/* ==================== RENDER: LOG ==================== */
function renderLog() {
  const el = document.getElementById('tab-log');
  const list = loadCatches().slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
  let items = '';
  list.forEach(function (c) {
    const areaName = (AREAS.find(function (a) { return a.id === c.area; }) || {}).name || '';
    items += '<div class="catch-item">' +
      '<button class="del" data-id="' + c.id + '">削除</button>' +
      '<div class="date">' + c.date + '　' + areaName + '</div>' +
      '<div class="fish">🐟 ' + c.fish + '</div>' +
      '<div class="place">' + c.place + '</div>' +
      (c.memo ? '<div class="memo">' + c.memo + '</div>' : '') +
      '</div>';
  });
  const fishOptions = FISH_DB.map(function (f) { return '<option value="' + f.name + '">' + f.name + '</option>'; }).join('') + '<option value="その他">その他</option>';
  const areaOptions = AREAS.map(function (a) { return '<option value="' + a.id + '">' + a.name + '</option>'; }).join('');
  el.innerHTML =
    '<div class="card"><h2>📒 釣果を記録する</h2>' +
    '<form class="logform" id="catchForm">' +
      '<label>日付</label><input type="date" name="date" required>' +
      '<label>エリア</label><select name="area">' + areaOptions + '</select>' +
      '<label>場所</label><input type="text" name="place" placeholder="例：三重城漁港" required>' +
      '<label>魚種</label><select name="fish">' + fishOptions + '</select>' +
      '<label>メモ</label><textarea name="memo" rows="2" placeholder="仕掛け・時間帯など"></textarea>' +
      '<button type="submit" class="btn-primary">記録する</button>' +
    '</form></div>' +
    '<div class="card"><h2>📋 釣果一覧</h2>' + (items || '<div class="muted">まだ記録がありません。</div>') + '</div>';
  const form = document.getElementById('catchForm');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const fd = new FormData(form);
    addCatch({ date: fd.get('date'), area: fd.get('area'), place: fd.get('place'), fish: fd.get('fish'), memo: fd.get('memo') });
    renderLog();
  });
  el.querySelectorAll('.del').forEach(function (btn) {
    btn.addEventListener('click', function () { deleteCatch(btn.getAttribute('data-id')); renderLog(); });
  });
}

/* ==================== NAV / INIT ==================== */
function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab-content').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('#bottomnav button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
}
function setArea(id) {
  state.area = id;
  state.showAllPoints = false;
  document.querySelectorAll('.area-chip').forEach(function (c) { c.classList.toggle('active', c.getAttribute('data-area') === id); });
  if (!state.cache[id]) refreshArea(id); else { renderHome(); renderPoints(); }
}
function init() {
  const tabsEl = document.getElementById('areaTabs');
  AREAS.forEach(function (a) {
    const chip = document.createElement('div');
    chip.className = 'area-chip' + (a.id === state.area ? ' active' : '');
    chip.setAttribute('data-area', a.id);
    chip.textContent = a.name;
    chip.addEventListener('click', function () { setArea(a.id); });
    tabsEl.appendChild(chip);
  });
  document.querySelectorAll('#bottomnav button').forEach(function (b) {
    b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
  });
  refreshArea(state.area);
  renderFish();
  renderLog();
  document.addEventListener('click', function (e) {
    const pop = document.getElementById('glossaryPopover');
    if (pop.style.display === 'block' && !pop.contains(e.target) && !e.target.classList.contains('term-chip') && !e.target.closest('.term-chip')) {
      pop.style.display = 'none';
    }
  });
}
init();
