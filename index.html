<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>沖縄釣り場マップ</title>
<style>
  :root{
    --bg:#050B14; --bg2:#0A1626; --panel:rgba(18,32,50,0.72); --panel-solid:#101F32;
    --cyan:#22D3EE; --cyan-bright:#7FF3FF; --cyan-dim:#0E7490;
    --sea:#22D3EE; --sea-deep:#0E9DB8; --sea-darker:#0B7285;
    --coral:#FF3D81; --coral-dark:#FF6FA0;
    --sand:#0F2036; --sand-dark:#1E3A55;
    --ink:#EAF6FB; --ink-soft:#8FAFC2;
    --good:#00E6A0; --warn:#FFB020; --warn-bg:rgba(255,176,32,0.14); --danger:#FF3D5A;
    --line:rgba(127,243,255,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(34,211,238,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 10%, rgba(255,61,129,0.10), transparent 55%),
      repeating-linear-gradient(0deg, rgba(127,243,255,0.035) 0px, rgba(127,243,255,0.035) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(127,243,255,0.035) 0px, rgba(127,243,255,0.035) 1px, transparent 1px, transparent 40px),
      var(--bg);
    color:var(--ink); font-size:16px; line-height:1.65; -webkit-text-size-adjust:100%;
  }
  #app{max-width:1120px; margin:0 auto; min-height:100vh; position:relative;}
  header{
    background:linear-gradient(120deg,#071827 0%, #0B2A3E 55%, #061520 100%);
    color:#fff; padding:36px 32px 30px; position:relative; overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  header::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:0.5;
    background-image: radial-gradient(circle at 85% 20%, rgba(34,211,238,0.25), transparent 45%);
  }
  header .inner{max-width:1120px; margin:0 auto; position:relative;}
  header h1{margin:0; font-size:clamp(24px,4vw,34px); font-weight:800; display:flex; align-items:center; gap:12px; letter-spacing:0.02em;
    background:linear-gradient(90deg,#fff, var(--cyan-bright)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  header p{margin:10px 0 0; font-size:15px; color:var(--ink-soft); max-width:560px;}
  header::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--cyan) 30%, var(--coral) 70%, transparent);
    box-shadow:0 0 12px 1px rgba(34,211,238,0.6);
  }
  nav#bottomnav{
    position:sticky; top:0; z-index:40; background:rgba(8,16,26,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line); display:flex; justify-content:center; gap:2px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  nav#bottomnav .inner{display:flex; max-width:1120px; width:100%; margin:0 auto; padding:0 12px;}
  nav#bottomnav button{
    flex:0 0 auto; background:none; border:none; border-bottom:3px solid transparent; padding:16px 20px; font-size:15px;
    font-weight:700; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap;
    transition:color 0.15s;
  }
  nav#bottomnav button .ic{font-size:18px; filter:grayscale(0.3);}
  nav#bottomnav button.active{color:var(--cyan-bright); border-bottom-color:var(--cyan); text-shadow:0 0 12px rgba(34,211,238,0.5);}
  nav#bottomnav button:hover{color:#fff;}
  .area-tabs{
    display:flex; gap:8px; flex-wrap:wrap; padding:20px 32px 4px; max-width:1120px; margin:0 auto;
  }
  .area-chip{
    flex:0 0 auto; padding:9px 18px; border-radius:8px; background:var(--panel); border:1px solid var(--sand-dark);
    color:var(--ink-soft); font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap; backdrop-filter:blur(6px);
    transition:all 0.15s;
  }
  .area-chip.active{background:linear-gradient(120deg,var(--cyan-dim),var(--cyan)); border-color:var(--cyan); color:#04222a; box-shadow:0 0 16px rgba(34,211,238,0.45);}
  .area-chip:hover:not(.active){border-color:var(--cyan); color:var(--cyan-bright);}
  .plan-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 32px 4px; max-width:1120px; margin:0 auto;
  }
  .plan-bar .plan-label{font-size:13.5px; font-weight:700; color:var(--ink-soft);}
  .plan-bar select{
    background:var(--panel); color:var(--ink); border:1px solid var(--sand-dark); border-radius:8px; padding:8px 12px;
    font-size:14px; font-weight:600; cursor:pointer; backdrop-filter:blur(6px);
  }
  .plan-bar select:focus{outline:none; border-color:var(--cyan);}
  .plan-bar .plan-live{font-size:12px; color:var(--good); font-weight:700;}
  main{padding:20px 32px 56px; max-width:1120px; margin:0 auto;}
  .tab-content{display:none;}
  .tab-content.active{display:block;}
  .card{
    background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:14px; padding:24px; margin-bottom:20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35); border:1px solid var(--line); position:relative;
  }
  .card::before{
    content:""; position:absolute; left:14px; right:14px; top:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(127,243,255,0.6), transparent);
  }
  .card h2{margin:0 0 14px; font-size:19px; color:var(--cyan-bright); display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:0.01em;}
  .card h3{margin:0 0 10px; font-size:19px; color:var(--ink); font-weight:800;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:10px;}
  .stat{background:var(--sand); border-radius:10px; padding:16px 10px; text-align:center; border:1px solid var(--sand-dark);}
  .stat .v{font-size:22px; font-weight:800; color:var(--cyan-bright); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; text-shadow:0 0 14px rgba(34,211,238,0.35);}
  .stat .l{font-size:12px; color:var(--ink-soft); margin-top:6px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;}
  .tide-chart{width:100%; height:auto; max-height:260px; display:block; margin:14px auto 0;}
  .alert-banner{
    display:flex; align-items:flex-start; gap:12px; background:linear-gradient(120deg,rgba(255,61,90,0.18),rgba(255,61,90,0.08));
    border:1px solid rgba(255,61,90,0.5); border-radius:14px; padding:16px 18px; margin-bottom:20px; box-shadow:0 0 20px rgba(255,61,90,0.15);
  }
  .alert-banner .ab-icon{font-size:26px; line-height:1;}
  .alert-banner b{color:#FF7A8C; font-size:16px;}
  .alert-banner .ab-sub{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5;}
  .jma-compare{background:var(--sand); border:1px solid var(--sand-dark); border-radius:10px; padding:12px 14px; margin-top:12px; font-size:13.5px; line-height:1.6;}
  .jma-compare .jc-label{color:var(--cyan-bright); font-weight:700; margin-right:4px;}
  .comment-line{margin-top:10px; font-size:14px; line-height:1.6; padding:10px 12px; background:var(--sand); border-radius:10px; border:1px solid var(--sand-dark);}
  .expect-badge{display:inline-flex; align-items:center; gap:6px; background:rgba(34,211,238,0.1); border:1px solid rgba(34,211,238,0.4); border-radius:8px; padding:6px 12px; font-size:14px; font-weight:700; color:var(--cyan-bright); margin-top:10px;}
  .expect-badge b{font-size:17px; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace;}
  .hotspot-toggle{margin-top:10px; background:none; border:1px dashed var(--sand-dark); color:var(--ink-soft); border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; width:100%; text-align:left;}
  .hotspot-toggle:hover{border-color:var(--cyan);}
  .hotspot-detail{margin-top:8px; font-size:13.5px; color:var(--ink-soft); line-height:1.6; background:rgba(34,211,238,0.06); border-left:3px solid var(--cyan-dim); padding:10px 12px; border-radius:0 8px 8px 0;}
  .map-embed-wrap{margin-top:12px;}
  .map-embed{width:100%; height:220px; border:1px solid var(--sand-dark); border-radius:10px; filter:invert(0.92) hue-rotate(180deg) saturate(1.1);}
  .map-link{display:inline-block; margin-top:8px; font-size:12.5px; font-weight:700; color:var(--cyan-bright); text-decoration:none; border:1px solid rgba(34,211,238,0.4); border-radius:8px; padding:6px 12px;}
  .map-link:hover{background:rgba(34,211,238,0.1);}
  .home-points-preview .point-card{margin-bottom:0;}
  .windy-embed{width:100%; height:380px; border:1px solid var(--sand-dark); border-radius:14px; display:block;}
  .ext-link{display:block; background:var(--sand); border:1px solid var(--sand-dark); border-radius:10px; padding:12px 14px; margin-bottom:8px; color:var(--cyan-bright); font-weight:700; font-size:14px; text-decoration:none;}
  .ext-link:hover{border-color:var(--cyan);}
  .alert-banner .jma-refresh-btn{font-size:12.5px; padding:7px 14px;}
  .fish-area-heading{font-size:15px; color:var(--cyan-bright); font-weight:800; margin:18px 0 10px; display:flex; align-items:center; gap:6px;}
  .fish-area-heading:first-of-type{margin-top:4px;}
  .btn-refresh{border:1px solid var(--cyan); background:rgba(34,211,238,0.1); color:var(--cyan-bright); border-radius:8px; padding:9px 18px; font-size:13.5px; font-weight:700; cursor:pointer; transition:all 0.15s;}
  .btn-refresh:hover{background:var(--cyan); color:#04222a;}
  .badge{display:inline-block; padding:5px 12px; border-radius:6px; font-size:12.5px; font-weight:800; letter-spacing:0.02em;}
  .badge-niche{background:rgba(255,61,129,0.15); color:var(--coral-dark); border:1px solid rgba(255,61,129,0.4);}
  .badge-warn{background:var(--warn-bg); color:var(--warn); border:1px solid rgba(255,176,32,0.4);}
  .badge-good{background:rgba(0,230,160,0.15); color:var(--good); border:1px solid rgba(0,230,160,0.5); animation:pop 1.4s ease-in-out infinite;}
  .badge-moon{background:rgba(127,180,255,0.12); color:#9FC3FF; border:1px solid rgba(127,180,255,0.35);}
  @keyframes pop{0%,100%{box-shadow:0 0 0 rgba(0,230,160,0);}50%{box-shadow:0 0 12px rgba(0,230,160,0.6);}}
  .points-grid{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:760px){ .points-grid{grid-template-columns:1fr 1fr;} }
  .point-card{background:var(--sand); border-radius:12px; padding:18px 20px; border:1px solid var(--sand-dark); border-left:3px solid var(--cyan-dim);}
  .point-card .rank{font-size:20px; margin-right:6px;}
  .point-card .name{font-weight:800; font-size:17px; color:var(--ink);}
  .point-card .muni{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .point-card .timing{margin-top:10px; font-size:15px; color:var(--coral-dark); font-weight:800; line-height:1.5;}
  .point-card .advice{margin-top:8px; font-size:14px; color:var(--ink-soft); line-height:1.6;}
  .point-card .tags{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;}
  .toggle-all{width:100%; text-align:center; background:var(--panel); border:1px dashed var(--cyan-dim); color:var(--cyan-bright); border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; margin-top:4px;}
  .toggle-all:hover{background:rgba(34,211,238,0.08);}
  .fish-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media(min-width:640px){ .fish-grid{grid-template-columns:repeat(6,1fr);} }
  .fish-btn{background:var(--sand); border:1px solid var(--sand-dark); border-radius:12px; padding:16px 8px; text-align:center; cursor:pointer; transition:all 0.15s;}
  .fish-btn:hover{border-color:var(--cyan);}
  .fish-btn.active{border-color:var(--coral); background:rgba(255,61,129,0.08); box-shadow:0 0 16px rgba(255,61,129,0.25);}
  .fish-avatar{width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--cyan-dim),var(--cyan)); color:#04222a; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; margin:0 auto 10px; box-shadow:0 0 14px rgba(34,211,238,0.35);}
  .fish-btn .fname{font-size:13px; font-weight:700; line-height:1.4; color:var(--ink);}
  .rig-svg{width:100%; max-width:260px; display:block; margin:14px auto;}
  .fish-svg{width:100%; max-width:320px; display:block; margin:0 auto 14px;}
  .fish-svg-mini{width:100%; max-width:80px; display:block; margin:0 auto 8px; border-radius:10px;}
  .cooking-box{margin-top:14px; background:var(--sand); border:1px solid var(--sand-dark); border-radius:12px; padding:14px 16px; font-size:14px; line-height:1.7;}
  .cooking-box .ck-label{color:var(--good); font-weight:800; display:block; margin-bottom:4px;}
  .term-chip{display:inline-flex; align-items:center; gap:5px; background:var(--sand); border:1px solid var(--sand-dark); border-radius:8px; padding:6px 14px; font-size:14px; font-weight:600; margin:4px 6px 4px 0; cursor:pointer; color:var(--ink);}
  .term-chip:hover{border-color:var(--cyan);}
  .term-chip .q{background:var(--cyan); color:#04222a; border-radius:50%; width:17px; height:17px; font-size:11px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; font-weight:800;}
  #glossaryPopover{position:fixed; left:20px; right:20px; bottom:24px; max-width:520px; margin:0 auto; background:var(--panel-solid); color:#fff; padding:16px 18px; border-radius:12px; font-size:14.5px; line-height:1.6; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:1px solid var(--line); display:none; z-index:50;}
  #glossaryPopover b{color:var(--cyan-bright); font-size:15.5px;}
  #glossaryPopover .close{float:right; cursor:pointer; opacity:0.75; font-size:15px; padding:0 2px;}
  form.logform{display:flex; flex-direction:column; gap:12px; max-width:480px;}
  form.logform label{font-size:13.5px; color:var(--ink-soft); font-weight:700;}
  form.logform input, form.logform select, form.logform textarea{
    padding:12px 14px; border-radius:8px; border:1px solid var(--sand-dark); font-size:15.5px; font-family:inherit; width:100%; color:var(--ink); background:var(--sand);
  }
  form.logform input:focus, form.logform select:focus, form.logform textarea:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,0.2);}
  .btn-primary{background:linear-gradient(120deg,var(--cyan-dim),var(--cyan)); color:#04222a; border:none; border-radius:10px; padding:13px; font-size:15.5px; font-weight:800; cursor:pointer; box-shadow:0 4px 16px rgba(34,211,238,0.3);}
  .btn-primary:hover{filter:brightness(1.1);}
  .catch-item{background:var(--sand); border-radius:12px; padding:16px 18px; margin-bottom:12px; position:relative; border:1px solid var(--sand-dark); border-left:3px solid var(--coral);}
  .catch-item .date{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .catch-item .fish{font-weight:800; font-size:16px; margin-top:4px; color:var(--ink);}
  .catch-item .place{font-size:14px; color:var(--ink-soft);}
  .catch-item .memo{font-size:14px; margin-top:6px; color:var(--ink);}
  .catch-item .del{position:absolute; right:14px; top:14px; background:transparent; border:1px solid var(--sand-dark); border-radius:8px; color:var(--coral-dark); font-size:12.5px; font-weight:700; padding:4px 10px; cursor:pointer;}
  .catch-item .del:hover{background:var(--coral); color:#fff; border-color:var(--coral);}
  .muted{color:var(--ink-soft); font-size:14px;}
  .disclaimer{font-size:12.5px; color:var(--ink-soft); margin-top:12px; line-height:1.6; border-top:1px dashed var(--sand-dark); padding-top:10px;}
  footer{max-width:1120px; margin:0 auto; padding:8px 32px 40px; color:var(--ink-soft); font-size:13px; text-align:center;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="inner">
      <h1>🌊 沖縄釣り場マップ</h1>
      <p>潮汐・風・波から、今日のチャンスタイムを自動チェック！</p>
    </div>
  </header>

  <nav id="bottomnav">
    <div class="inner">
      <button data-tab="home" class="active"><span class="ic">🏠</span>ホーム</button>
      <button data-tab="points"><span class="ic">🎯</span>おすすめポイント</button>
      <button data-tab="fish"><span class="ic">🐟</span>狙いの魚</button>
      <button data-tab="log"><span class="ic">📒</span>釣果</button>
    </div>
  </nav>

  <div class="area-tabs" id="areaTabs"></div>
  <div class="plan-bar" id="planBar"></div>

  <main>
    <section id="tab-home" class="tab-content active"></section>
    <section id="tab-points" class="tab-content"></section>
    <section id="tab-fish" class="tab-content"></section>
    <section id="tab-log" class="tab-content"></section>
  </main>

  <footer>🎣 沖縄釣り場マップ・個人用ツール — データはOpen-Meteo（風・波）と簡易潮汐計算による目安です</footer>

  <div id="glossaryPopover"></div>
</div>

<script>
/* ==================== DATA ==================== */
const AREAS = [
  { id: 'naha', name: '那覇周辺', lat: 26.2124, lon: 127.6809 },
  { id: 'itoman', name: '糸満', lat: 26.1215, lon: 127.6685 },
  { id: 'nanjo', name: '南城市', lat: 26.1550, lon: 127.7800 },
  { id: 'chubu_w', name: '中部（西海岸）', lat: 26.4970, lon: 127.8360 },
  { id: 'chubu_e', name: '中部（東海岸）', lat: 26.4270, lon: 127.8330 },
  { id: 'north_w', name: '北部（やんばる西）', lat: 26.5918, lon: 127.9770 },
  { id: 'north_e', name: '北部（やんばる東）', lat: 26.7300, lon: 128.2350 },
];

// 気象庁「地方海上予報」「警報注意報」の集約データと、アプリのエリアの対応づけ。
// warnClass10 = 沖縄気象台の警報区分（本島中南部/本島北部）、
// marineArea = 地方海上予報の海域コード（東シナ海南部=6010 / 沖縄東方海上=6020）。
const JMA_AREA_META = {
  naha: { warnClass10: '471010', marineArea: '6010' },
  itoman: { warnClass10: '471010', marineArea: '6010' },
  nanjo: { warnClass10: '471010', marineArea: '6020' },
  chubu_w: { warnClass10: '471010', marineArea: '6010' },
  chubu_e: { warnClass10: '471010', marineArea: '6020' },
  north_w: { warnClass10: '471020', marineArea: '6010' },
  north_e: { warnClass10: '471020', marineArea: '6020' },
};

const POINTS = [
  { name: '三重城漁港', muni: '那覇市', areaId: 'naha', type: '堤防', tideAffinity: 'any', coastFacing: 'W', timingType: 'asa_yu_mazume', advice: 'サビキ仕掛けでグルクンの回遊を狙う。堤防先端が特におすすめ', lat: 26.2095, lon: 127.6712 },
  { name: '波の上うみそら公園', muni: '那覇市', areaId: 'naha', type: '堤防', tideAffinity: 'any', coastFacing: 'W', lat: 26.2183, lon: 127.6738 },
  { name: '与那原マリーナ', muni: '与那原町', areaId: 'naha', type: 'マリーナ', tideAffinity: 'any', coastFacing: 'sheltered', lat: 26.2010, lon: 127.7590 },
  { name: '西原漁港', muni: '西原町', areaId: 'naha', type: '漁港', tideAffinity: 'any', coastFacing: 'E', niche: true, lat: 26.2270, lon: 127.7620 },
  { name: '西崎一文字', muni: '糸満市', areaId: 'itoman', type: '堤防', tideAffinity: 'any', coastFacing: 'W', lat: 26.1245, lon: 127.6435 },
  { name: '糸満漁港', muni: '糸満市', areaId: 'itoman', type: '漁港', tideAffinity: 'any', coastFacing: 'W', lat: 26.1215, lon: 127.6685 },
  { name: '糸満フィッシャリーナ', muni: '糸満市', areaId: 'itoman', type: 'マリーナ', tideAffinity: 'any', coastFacing: 'sheltered', niche: true, lat: 26.1230, lon: 127.6520 },

/* ==================== TIDE (simplified harmonic model, approximate) ==================== */
const TIDE_EPOCH = Date.UTC(2000, 0, 1, 0, 0, 0);
const Z0 = 150;
const CONSTITUENTS = [
  { name: 'M2', speed: 28.9841042, amp: 25.2, phase: 158 },
  { name: 'S2', speed: 30.0000000, amp: 12.6, phase: 178 },
  { name: 'K1', speed: 15.0410686, amp: 24.8, phase: 253 },
  { name: 'O1', speed: 13.9430356, amp: 18.6, phase: 231 },
  { name: 'N2', speed: 28.4397295, amp: 5.3, phase: 141 },
  { name: 'K2', speed: 30.0821373, amp: 3.7, phase: 176 },
  { name: 'P1', speed: 14.9589314, amp: 8.1, phase: 251 },
  { name: 'Q1', speed: 13.3986609, amp: 3.9, phase: 227 },
];
function tideHeightCm(date) {
  const hours = (date.getTime() - TIDE_EPOCH) / 3600000;
  let h = Z0;
  for (const c of CONSTITUENTS) {

    h += c.amp * Math.cos(angle);

  return h;

  }

}

  const ext = [];
  for (let i = 1; i < samples.length - 1; i++) {
    const a = samples[i - 1].h, b = samples[i].h, c = samples[i + 1].h;
    if (b > a && b > c) ext.push({ t: samples[i].t, h: b, type: 'high' });
    if (b < a && b < c) ext.push({ t: samples[i].t, h: b, type: 'low' });
  }
  return ext;
}

  const h0 = tideHeightCm(new Date(now.getTime() - 15 * 60000));
  const h1 = tideHeightCm(new Date(now.getTime() + 15 * 60000));
  const diff = h1 - h0;
  const near = extrema.find(e => Math.abs(e.t.getTime() - now.getTime()) <= 45 * 60000);
  if (near) return near.type === 'high' ? 'high' : 'low';
  return diff > 0 ? 'rising' : 'falling';
}

  const list = extrema.filter(e => e.type === type);

  return list[0];

}

const COMPASS_JP = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];

      else if (ctx.tideState === 'high') { score += 1; }
      else { score -= 1; }
      break;
    case 'falling':
      if (ctx.tideState === 'falling') { score += 3; reasons.push('下げ潮のタイミング'); }
      else { score -= 1; }
      break;
    case 'aroundHighLow':
      if (ctx.tideState === 'high' || ctx.tideState === 'low') { score += 3; reasons.push('潮止まり前後が狙い目'); }

    if (ctx.wave >= 2.0) { warning = '高波注意：釣行は控えめに'; score -= 5; }

function todayDateStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const state = { area: 'naha', cache: {}, activeTab: 'home', showAllPoints: false, activeFish: null, jma: null, jmaLoaded: false, jmaLoading: false, jmaError: false, expandedPoints: new Set(), planDate: todayDateStr(), planHour: 'now' };
function getTargetDateTime() {
  const parts = state.planDate.split('-').map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  if (state.planHour === 'now' && state.planDate === todayDateStr()) return new Date();
  const hour = state.planHour === 'now' ? new Date().getHours() : Number(state.planHour);
  return new Date(y, m - 1, d, hour, 0, 0, 0);
}
function isViewingLiveNow() { return state.planDate === todayDateStr() && state.planHour === 'now'; }
function sameCalendarDate(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function dayOffsetFromToday(date) {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const t1 = new Date(date); t1.setHours(0, 0, 0, 0);
  return Math.round((t1 - t0) / 86400000);
}
function pickHourlyIndex(times, target) {
  if (!times || !times.length) return null;
  let best = -1, bestDiff = Infinity;
  for (let i = 0; i < times.length; i++) {
    const diff = Math.abs(times[i].getTime() - target.getTime());
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  }
  return best;
}

/* ==================== JMA (気象庁 地方海上予報・警報注意報) ==================== */
// 気象庁のbosai公開APIはAccess-Control-Allow-Origin: *が付与されており、
// ブラウザから直接fetchできる（CORS対応確認済み）。よってスナップショットではなく毎回ライブ取得する。
const JMA_OFFICE = '471000'; // 沖縄気象台
const JMA_WARNING_CODE_MAP = {
  '03': ['レベル3大雨警報', 'warning'], '10': ['レベル2大雨注意報', 'advisory'], '12': ['レベル5大雨特別警報', 'special'],
  '33': ['レベル5大雨特別警報', 'special'], '08': ['レベル3高潮警報', 'warning'], '21': ['レベル2高潮注意報', 'advisory'],
  '38': ['レベル5高潮特別警報', 'special'], '04': ['洪水警報', 'warning'], '25': ['洪水注意報', 'advisory'],
  '29': ['土砂災害情報', 'warning'], '02': ['暴風警報', 'warning'], '05': ['暴風雪警報', 'warning'], '06': ['大雪警報', 'warning'],
  '07': ['波浪警報', 'warning'], '14': ['雷注意報', 'advisory'], '15': ['強風注意報', 'advisory'], '16': ['波浪注意報', 'advisory'],
  '17': ['大雪注意報', 'advisory'], '18': ['着雪注意報', 'advisory'], '19': ['融雪注意報', 'advisory'], '20': ['濃霧注意報', 'advisory'],
  '22': ['低温注意報', 'advisory'], '23': ['霜注意報', 'advisory'], '24': ['乾燥注意報', 'advisory'], '26': ['なだれ注意報', 'advisory'],
  '27': ['その他の注意報', 'advisory'], '32': ['暴風雪特別警報', 'special'], '35': ['大雪特別警報', 'special'], '36': ['暴風特別警報', 'special'],
  '37': ['波浪特別警報', 'special']
};
const JMA_INACTIVE_STATUSES = ['解除', '発表警報・注意報はなし'];
async function fetchJmaWarnings(office) {
  const res = await fetch('https://www.jma.go.jp/bosai/warning/data/r8/' + office + '.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('warning fetch failed: ' + res.status);
  const entries = await res.json();
  const latest = {};
  entries.forEach(function (e) {
    ((e.warning && e.warning.class10Items) || []).forEach(function (item) {
      const cur = latest[item.areaCode];
      if (!cur || new Date(e.reportDatetime) > new Date(cur.reportDatetime)) {
        latest[item.areaCode] = { reportDatetime: e.reportDatetime, kinds: item.kinds, publishingOffice: e.publishingOffice };
      }
    });
  });
  const warningsByArea = {};
  let publishingOffice = null;
  Object.keys(latest).forEach(function (area) {
    const info = latest[area];
    if (info.publishingOffice) publishingOffice = info.publishingOffice;
    const active = info.kinds.filter(function (k) { return k.code && JMA_INACTIVE_STATUSES.indexOf(k.status) === -1; });
    warningsByArea[area] = active.map(function (k) {
      const m = JMA_WARNING_CODE_MAP[k.code] || ['不明', 'advisory'];
      return { code: k.code, name: m[0], level: m[1], status: k.status, additions: k.additions || [], reportDatetime: info.reportDatetime };
    });
  });
  return { warningsByArea: warningsByArea, publishingOffice: publishingOffice };
}
async function fetchJmaMarine(office) {
  const res = await fetch('https://www.jma.go.jp/bosai/seawarning/data/forecast/' + office + '.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('marine fetch failed: ' + res.status);
  const json = await res.json();
  const marine = {};
  (json.forecasts || []).forEach(function (period) {
    const key = period.name === '今日' ? 'today' : (period.name === '明日' ? 'tomorrow' : null);
    if (!key) return;
    (period.properties || []).forEach(function (p) {
      const code = p.area.code;
      if (!marine[code]) marine[code] = { name: p.area.name };
      marine[code][key] = {
        wind: (p.wind || []).join(' '), weather: (p.weather || []).join(' '),
        wave: (p.wave || []).join(' '), vis: (p.vis || []).join(' ')
      };
    });
  });
  return { marine: marine, reportDatetime: json.reportDatetime, publishingOffice: json.publishingOffice };
}
async function fetchJmaData() {
  state.jmaLoading = true;
  state.jmaError = false;
  renderHome();
  try {
    const results = await Promise.all([fetchJmaWarnings(JMA_OFFICE), fetchJmaMarine(JMA_OFFICE)]);
    const w = results[0], m = results[1];
    state.jma = {
      fetchedAt: new Date().toISOString(),
      publishingOffice: m.publishingOffice || w.publishingOffice || '沖縄気象台',
      reportDatetime: m.reportDatetime,
      warningsByArea: w.warningsByArea,
      marine: m.marine
    };
  } catch (e) {
    state.jmaError = true; // 取得失敗時は直前のデータを維持する（初回失敗ならnullのまま）
  }
  state.jmaLoading = false;
  state.jmaLoaded = true;
  renderHome();
}

// 7日分の時間別データを丸ごと取得しておき、日付・時刻の選択に応じて後から該当インデックスを拾う。
async function fetchAreaData(area) {
  const wUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + area.lat + '&longitude=' + area.lon +
    '&hourly=wind_speed_10m,wind_direction_10m,temperature_2m&daily=sunrise,sunset&timezone=Asia%2FTokyo&forecast_days=7&wind_speed_unit=ms';
  const mUrl = 'https://marine-api.open-meteo.com/v1/marine?latitude=' + area.lat + '&longitude=' + area.lon +
    '&hourly=wave_height,wave_period&timezone=Asia%2FTokyo&forecast_days=7';
  const result = {
    hourlyTimes: [], windSpeedArr: [], windDirArr: [], tempArr: [],
    waveTimes: [], waveHeightArr: [], wavePeriodArr: [],
    dailyDates: [], sunriseArr: [], sunsetArr: [],
    weatherError: false, waveError: false
  };
  try {
    const wRes = await fetch(wUrl);
    const wJson = await wRes.json();
    if (wJson.hourly && wJson.hourly.time) {
      result.hourlyTimes = wJson.hourly.time.map(function (t) { return new Date(t); });
      result.windSpeedArr = wJson.hourly.wind_speed_10m || [];
      result.windDirArr = wJson.hourly.wind_direction_10m || [];
      result.tempArr = wJson.hourly.temperature_2m || [];
    }
    if (wJson.daily && wJson.daily.time) {
      result.dailyDates = wJson.daily.time.map(function (t) { return new Date(t + 'T00:00:00'); });
      result.sunriseArr = (wJson.daily.sunrise || []).map(function (t) { return t ? new Date(t) : null; });
      result.sunsetArr = (wJson.daily.sunset || []).map(function (t) { return t ? new Date(t) : null; });
    }
  } catch (e) { result.weatherError = true; }
  try {
    const mRes = await fetch(mUrl);
    const mJson = await mRes.json();
    if (mJson.hourly && mJson.hourly.time) {
      result.waveTimes = mJson.hourly.time.map(function (t) { return new Date(t); });
      result.waveHeightArr = mJson.hourly.wave_height || [];
      result.wavePeriodArr = mJson.hourly.wave_period || [];
    }
  } catch (e) { result.waveError = true; }
  return result;
}
async function refreshArea(areaId) {
  if (state.cache[areaId] && state.cache[areaId].loading) return; // 取得中なら重複フェッチしない
  const area = AREAS.find(function (a) { return a.id === areaId; });
  state.cache[areaId] = { loading: true };
  refreshCtxViews();
  const data = await fetchAreaData(area);
  state.cache[areaId] = { loading: false, data: data, ts: new Date() };
  refreshCtxViews();
}

/* ==================== CATCH LOG (localStorage) ==================== */
function loadCatches() {
  const raw = localStorage.getItem('okFishingCatches');
  if (!raw) { localStorage.setItem('okFishingCatches', JSON.stringify(SAMPLE_CATCHES)); return SAMPLE_CATCHES.slice(); }
  try { return JSON.parse(raw); } catch (e) { return SAMPLE_CATCHES.slice(); }
}
function saveCatches(list) { localStorage.setItem('okFishingCatches', JSON.stringify(list)); }
function addCatch(record) {
  record.id = 'c-' + Date.now();
  const list = loadCatches();
  list.unshift(record);
  saveCatches(list);
  return list;
}
function deleteCatch(id) {
  const list = loadCatches().filter(function (c) { return c.id !== id; });
  saveCatches(list);
  return list;
}

function niceTideStep(range) {
  const steps = [10, 20, 25, 50, 100];
  for (let i = 0; i < steps.length; i++) { if (range / steps[i] <= 5) return steps[i]; }
  return 100;
}

  const w = 600, h = 190, padX = 46, padY = 26;
  const hs = timeline.map(function (s) { return s.h; });
  const minH = Math.min.apply(null, hs), maxH = Math.max.apply(null, hs);
  const scaleX = function (i) { return padX + (i / (timeline.length - 1)) * (w - 2 * padX); };
  const scaleY = function (v) { return h - padY - ((v - minH) / (maxH - minH || 1)) * (h - 2 * padY); };
  let d = '';
  timeline.forEach(function (s, i) { d += (i === 0 ? 'M' : 'L') + scaleX(i).toFixed(1) + ',' + scaleY(s.h).toFixed(1) + ' '; });
  let nowIdx = timeline.findIndex(function (s) { return s.t >= now; });
  if (nowIdx < 0) nowIdx = timeline.length - 1;
  const nowH = tideHeightCm(now);
  const nx = scaleX(nowIdx), ny = scaleY(nowH);
  let extMarks = '';
  extrema.forEach(function (e) {
    const idx = Math.round((e.t - timeline[0].t) / (5 * 60000));
    if (idx < 0 || idx >= timeline.length) return;
    const ex = Math.max(30, Math.min(w - 30, scaleX(idx)));
    const ey = scaleY(e.h);
    const ty = e.type === 'high' ? Math.max(12, ey - 10) : Math.min(h - 4, ey + 18);
    extMarks += '<circle cx="' + ex + '" cy="' + ey + '" r="4" fill="' + (e.type === 'high' ? '#FF3D81' : '#22D3EE') + '"/>';
    extMarks += '<text x="' + ex + '" y="' + ty + '" font-size="11" text-anchor="middle" fill="#CFEFF6">' + (e.type === 'high' ? '満' : '干') + ' ' + fmt(e.t) + '・' + Math.round(e.h) + 'cm</text>';
  });
  // 潮位の数値がひと目でわかるよう、キリの良い間隔（10/20/25/50/100cm）でY軸目盛りを描く。
  const step = niceTideStep(maxH - minH || 1);
  let grid = '';
  let axisLabels = '';
  const tickStart = Math.ceil(minH / step) * step;
  for (let v = tickStart; v <= maxH; v += step) {
    const gy = scaleY(v);
    grid += '<line x1="' + padX + '" y1="' + gy.toFixed(1) + '" x2="' + (w - padX) + '" y2="' + gy.toFixed(1) + '" stroke="rgba(127,243,255,0.10)" stroke-width="1"/>';
    axisLabels += '<text x="' + (padX - 8) + '" y="' + (gy + 4).toFixed(1) + '" font-size="11" text-anchor="end" fill="#8FAFC2">' + Math.round(v) + 'cm</text>';
  }
  for (let gx = padX; gx <= w - padX; gx += 60) grid += '<line x1="' + gx + '" y1="' + padY + '" x2="' + gx + '" y2="' + (h - padY) + '" stroke="rgba(127,243,255,0.08)" stroke-width="1"/>';
  const areaD = d.trim() + ' L' + (w - padX) + ',' + (h - padY) + ' L' + padX + ',' + (h - padY) + ' Z';
  const nowLabelX = Math.max(padX + 34, Math.min(w - padX - 34, nx));
  const nowLabelY = ny < h / 2 ? ny + 22 : ny - 14;
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="tide-chart" preserveAspectRatio="xMidYMid meet">' +
    '<defs>' +
      '<filter id="tideGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
      '<linearGradient id="tideFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>' +
    '</defs>' +
    grid +
    '<path d="' + areaD + '" fill="url(#tideFill)" stroke="none"/>' +
    '<path d="' + d + '" fill="none" stroke="#22D3EE" stroke-width="2.5" filter="url(#tideGlow)"/>' + extMarks +
    axisLabels +
    '<line x1="' + nx + '" y1="' + padY + '" x2="' + nx + '" y2="' + (h - padY) + '" stroke="#FF3D81" stroke-dasharray="4,3" stroke-width="1.5"/>' +
    '<circle cx="' + nx + '" cy="' + ny + '" r="5" fill="#FF3D81" stroke="#DCEFF5" stroke-width="1.5" filter="url(#tideGlow)"/>' +
    '<text x="' + nowLabelX + '" y="' + nowLabelY + '" font-size="12" font-weight="700" text-anchor="middle" fill="#FF9DBE">' + (isLive ? '現在' : 'この時刻') + ' ' + Math.round(nowH) + 'cm</text>' +
    '</svg>';
}
function getCtx(areaId) {
  areaId = areaId || state.area;
  const now = getTargetDateTime();
  const isLive = isViewingLiveNow();
  const timeline = buildTideTimeline(now);
  const extrema = findExtrema(timeline);
  const tideState = tideStateNow(now, extrema);
  const moonLabel = moonPhaseLabel(moonAgeDays(now));
  const cache = state.cache[areaId];
  const data = cache && cache.data ? cache.data : null;
  let wind = null, wave = null, wavePeriod = null, sunrise = null, sunset = null;
  if (data) {
    const wi = pickHourlyIndex(data.hourlyTimes, now);
    if (wi != null && wi >= 0 && data.windSpeedArr[wi] != null) wind = { speed: data.windSpeedArr[wi], direction: data.windDirArr[wi] };
    const vi = pickHourlyIndex(data.waveTimes, now);
    if (vi != null && vi >= 0 && data.waveHeightArr[vi] != null) { wave = data.waveHeightArr[vi]; wavePeriod = data.wavePeriodArr[vi]; }
    if (data.dailyDates && data.dailyDates.length) {
      const di = data.dailyDates.findIndex(function (dd) { return sameCalendarDate(dd, now); });
      if (di >= 0) { sunrise = data.sunriseArr[di]; sunset = data.sunsetArr[di]; }
    }
  }
  return { now: now, isLive: isLive, timeline: timeline, extrema: extrema, tideState: tideState, moonLabel: moonLabel,
    sunrise: sunrise, sunset: sunset,
    wind: wind, wave: wave, wavePeriod: wavePeriod,
    weatherError: data ? data.weatherError : false, waveError: data ? data.waveError : false, loading: cache ? cache.loading : true };
}

const MEDALS = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
// おすすめポイント／狙いの魚の全エリア横断表示など、どこでも同じ情報量で使う共通カード。
function buildPointCard(item, idx) {

  if (item.warning) badges += '<span class="badge badge-warn">⚠️ ' + item.warning + '</span> ';

  if (item.timing.badge) badges += '<span class="badge badge-moon">' + item.timing.badge + '</span> ';

    '<div class="row"><div><span class="rank">' + (idx != null ? MEDALS[idx] || '' : '') + '</span><span class="name">' + p.name + '</span></div><span class="muni">' + p.muni + '</span></div>' +

// カード内の「もっと詳しく」トグルに開閉イベントを配線する共通ヘルパー。
function wireHotspotToggles(rootEl, rerender) {
  rootEl.querySelectorAll('.hotspot-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const key = decodeURIComponent(btn.getAttribute('data-point'));

function scorePointsForArea(areaId, ctx) {
  const pts = POINTS.filter(function (p) { return p.areaId === areaId; });

    const timing = resolveTiming(p, ctx);
    return { point: p, score: s.score, reasons: s.reasons, warning: s.warning, timing: timing };
  });
  scored.sort(function (a, b) { return b.score - a.score; });
  return scored;
}

function renderFishAreaMatches(fish) {

  AREAS.forEach(function (area) {

    if (!state.cache[area.id]) { refreshArea(area.id); anyLoading = true; }
    else if (state.cache[area.id].loading) { anyLoading = true; }
    const ctxForArea = getCtx(area.id);
    const scoredAll = pts.map(function (p) {
      const s = scorePoint(p, ctxForArea);
      return { point: p, score: s.score, reasons: s.reasons, warning: s.warning, timing: resolveTiming(p, ctxForArea) };
    });
    scoredAll.sort(function (a, b) { return b.score - a.score; });
    const top = scoredAll.slice(0, 3);
    const loadingNote = (!state.cache[area.id] || state.cache[area.id].loading) ? '<span class="muted">（風・波を取得中…）</span>' : '';
    body += '<div class="fish-area-heading">📍 ' + area.name + ' ' + loadingNote + '</div><div class="points-grid">';
    top.forEach(function (item, idx) { body += buildPointCard(item, idx); });
    body += '</div>';

    body + '</div>';
}

  let areaMatches = '';
  if (state.activeFish) {
    const f = FISH_DB.find(function (x) { return x.key === state.activeFish; });
    const rigSvg = RIG_BUILDERS[f.rigType] ? RIG_BUILDERS[f.rigType]() : '';
    let terms = '';
    (f.terms || []).forEach(function (t) {
      terms += '<span class="term-chip" data-term="' + t + '"><span class="q">?</span>' + t + '</span>';
    });
    const fishSvg = FISH_SVG_BUILDERS[f.key] ? FISH_SVG_BUILDERS[f.key]() : '';
    detail = '<div class="card">' +
      '<h3>' + f.name + '</h3>' + fishSvg +
      '<div style="margin:4px 0 12px; text-align:center;" class="muted">仕掛け図解 ↓</div>' + rigSvg +
      '<div><b>仕掛け：</b>' + f.rig + '</div>' +
      '<div style="margin-top:4px;">' + terms + '</div>' +
      '<div style="margin-top:8px;"><b>餌：</b>' + f.bait + '</div>' +
      '<div style="margin-top:8px;"><b>狙い目：</b>' + f.timing + '</div>' +
      (f.cooking ? '<div class="cooking-box"><span class="ck-label">🍽️ 食べ方・おすすめ調理法</span>' + f.cooking + '</div>' : '') +
      '</div>';
    areaMatches = renderFishAreaMatches(f);
  }
  el.innerHTML = grid + detail + areaMatches;
  el.querySelectorAll('.fish-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { state.activeFish = btn.getAttribute('data-fish'); renderFish(); });
  });
  el.querySelectorAll('.term-chip').forEach(function (chip) {
    chip.addEventListener('click', function () { showGlossary(chip.getAttribute('data-term')); });
  });
  wireHotspotToggles(el, renderFish);
}
let glossaryTimer = null;
function showGlossary(term) {
  const pop = document.getElementById('glossaryPopover');
  pop.innerHTML = '<span class="close" id="glossaryClose">✕</span><b>' + term + '</b><br>' + (GLOSSARY[term] || '');
  pop.style.display = 'block';
  document.getElementById('glossaryClose').addEventListener('click', function () { pop.style.display = 'none'; });
  if (glossaryTimer) clearTimeout(glossaryTimer);
  glossaryTimer = setTimeout(function () { pop.style.display = 'none'; }, 7000);
}

/* ==================== RENDER: LOG ==================== */
function renderLog() {
  const el = document.getElementById('tab-log');
  const list = loadCatches().slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
  let items = '';
  list.forEach(function (c) {
    const areaName = (AREAS.find(function (a) { return a.id === c.area; }) || {}).name || '';
    items += '<div class="catch-item">' +
      '<button class="del" data-id="' + c.id + '">削除</button>' +
      '<div class="date">' + c.date + '　' + areaName + '</div>' +
      '<div class="fish">🐟 ' + c.fish + '</div>' +
      '<div class="place">' + c.place + '</div>' +
      (c.memo ? '<div class="memo">' + c.memo + '</div>' : '') +
      '</div>';
  });
  const fishOptions = FISH_DB.map(function (f) { return '<option value="' + f.name + '">' + f.name + '</option>'; }).join('') + '<option value="その他">その他</option>';
  const areaOptions = AREAS.map(function (a) { return '<option value="' + a.id + '">' + a.name + '</option>'; }).join('');
  el.innerHTML =
    '<div class="card"><h2>📒 釣果を記録する</h2>' +
    '<form class="logform" id="catchForm">' +
      '<label>日付</label><input type="date" name="date" required>' +
      '<label>エリア</label><select name="area">' + areaOptions + '</select>' +
      '<label>場所</label><input type="text" name="place" placeholder="例：三重城漁港" required>' +
      '<label>魚種</label><select name="fish">' + fishOptions + '</select>' +
      '<label>メモ</label><textarea name="memo" rows="2" placeholder="仕掛け・時間帯など"></textarea>' +
      '<button type="submit" class="btn-primary">記録する</button>' +
    '</form></div>' +
    '<div class="card"><h2>📋 釣果一覧</h2>' + (items || '<div class="muted">まだ記録がありません。</div>') + '</div>';
  const form = document.getElementById('catchForm');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const fd = new FormData(form);
    addCatch({ date: fd.get('date'), area: fd.get('area'), place: fd.get('place'), fish: fd.get('fish'), memo: fd.get('memo') });
    renderLog();
  });
  el.querySelectorAll('.del').forEach(function (btn) {
    btn.addEventListener('click', function () { deleteCatch(btn.getAttribute('data-id')); renderLog(); });
  });
}

/* ==================== NAV / INIT ==================== */
function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab-content').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('#bottomnav button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
}
function setArea(id) {
  state.area = id;
  state.showAllPoints = false;
  document.querySelectorAll('.area-chip').forEach(function (c) { c.classList.toggle('active', c.getAttribute('data-area') === id); });
  if (!state.cache[id]) refreshArea(id); else { renderHome(); renderPoints(); }
}
function refreshCtxViews() {
  renderHome();
  renderPoints();
  if (state.activeFish) renderFish();
}
function planDateOptions() {
  const opts = [];
  const base = new Date(); base.setHours(0, 0, 0, 0);
  const labels = ['今日', '明日'];
  const wd = ['日', '月', '火', '水', '木', '金', '土'];
  for (let i = 0; i < 7; i++) {
    const d = new Date(base.getTime() + i * 86400000);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const label = (d.getMonth() + 1) + '/' + d.getDate() + '(' + wd[d.getDay()] + ')' + (labels[i] ? '・' + labels[i] : '');
    opts.push({ value: iso, label: label });
  }
  return opts;
}
function renderPlanBar() {
  const bar = document.getElementById('planBar');
  const dateOpts = planDateOptions();
  const dateHtml = dateOpts.map(function (o) { return '<option value="' + o.value + '"' + (o.value === state.planDate ? ' selected' : '') + '>' + o.label + '</option>'; }).join('');
  const isToday = state.planDate === todayDateStr();
  let hourHtml = '';
  if (isToday) hourHtml += '<option value="now"' + (state.planHour === 'now' ? ' selected' : '') + '>現在（自動）</option>';
  for (let h = 0; h < 24; h++) {
    hourHtml += '<option value="' + h + '"' + (String(state.planHour) === String(h) ? ' selected' : '') + '>' + h + '時</option>';
  }
  bar.innerHTML =
    '<span class="plan-label">🗓️ 表示する日時</span>' +
    '<select id="planDateSelect">' + dateHtml + '</select>' +
    '<select id="planHourSelect">' + hourHtml + '</select>' +
    (isViewingLiveNow() ? '<span class="plan-live">● 現在の状況を表示中</span>' : '');
  document.getElementById('planDateSelect').addEventListener('change', function (e) {
    state.planDate = e.target.value;
    if (state.planDate !== todayDateStr() && state.planHour === 'now') state.planHour = new Date().getHours();
    renderPlanBar();
    refreshCtxViews();
  });
  document.getElementById('planHourSelect').addEventListener('change', function (e) {
    state.planHour = e.target.value === 'now' ? 'now' : Number(e.target.value);
    renderPlanBar();
    refreshCtxViews();
  });
}
function init() {
  const tabsEl = document.getElementById('areaTabs');
  AREAS.forEach(function (a) {
    const chip = document.createElement('div');
    chip.className = 'area-chip' + (a.id === state.area ? ' active' : '');
    chip.setAttribute('data-area', a.id);
    chip.textContent = a.name;
    chip.addEventListener('click', function () { setArea(a.id); });
    tabsEl.appendChild(chip);
  });
  document.querySelectorAll('#bottomnav button').forEach(function (b) {
    b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
  });
  renderPlanBar();
  refreshArea(state.area);
  fetchJmaData();
  renderFish();
  renderLog();
  document.addEventListener('click', function (e) {
    const pop = document.getElementById('glossaryPopover');
    if (pop.style.display === 'block' && !pop.contains(e.target) && !e.target.classList.contains('term-chip') && !e.target.closest('.term-chip')) {
      pop.style.display = 'none';
    }
  });
}
init();
</script>
